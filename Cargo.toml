[package]
name = "pi-calc"
version = "0.1.0"
edition = "2021"
description = "A very fast pi calculator using the Chudnovsky algorithm"
authors = ["Charlie Harper"]
license = "MIT"
repository = "https://github.com/charlie284/pi-calc"
homepage = "https://github.com/charlie284/pi-calc"
keywords = ["pi", "chudnovsky", "math", "big-number"]
categories = ["command-line-utilities", "mathematics", "science"]

[dependencies]
flint3-sys = { version = "3.6.1", features = ["gmp-mpfr-sys"] }
rug = { version = "1.24", features = ["integer"] }
